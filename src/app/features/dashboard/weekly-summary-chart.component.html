<div class="mb-5 flex items-start justify-between gap-2">
  <div>
    <h2 class="text-base font-semibold">Actividad semanal</h2>
    <p class="mt-1 text-[11px] text-muted">Solicitudes por día</p>
  </div>
  <select
    #weekSelect
    aria-label="Semana de actividad"
    class="min-h-11 max-w-[130px] rounded-lg bg-transparent text-[11px] text-muted"
    [value]="week()"
    (change)="week.set(weekSelect.value)"
  >
    <option class="bg-surface">Esta semana</option>
    <option class="bg-surface">Semana anterior</option>
  </select>
</div>
<div class="mb-2 flex flex-wrap gap-4 text-[11px] text-muted">
  <span class="flex items-center gap-2"><span class="size-2 rounded-full bg-primary"></span>Correctas</span
  ><span class="flex items-center gap-2"><span class="size-2 rounded-full bg-info"></span>Fallidas</span>
</div>
<svg
  viewBox="0 0 290 260"
  role="img"
  [attr.aria-label]="'Solicitudes correctas y fallidas, ' + week() + '. Datos ficticios.'"
  class="mx-auto w-full max-w-[330px]"
>
  @for (tick of [100, 80, 60, 40, 20, 0]; track tick) {
    <line
      x1="32"
      x2="275"
      [attr.y1]="225 - tick * 1.9"
      [attr.y2]="225 - tick * 1.9"
      stroke="#526176"
      stroke-opacity=".22"
    />
    <text x="23" [attr.y]="229 - tick * 1.9" text-anchor="end" fill="#a5b4c8" font-size="10">{{ tick }}</text>
  }
  @for (bar of bars(); track bar.name) {
    <rect
      [attr.x]="bar.x"
      [attr.y]="225 - bar.value * 1.9"
      width="11"
      [attr.height]="bar.value * 1.9"
      rx="2"
      fill="#86cee9"
    >
      <title>{{ bar.name }}: {{ bar.value }} cientos de solicitudes de ejemplo</title>
    </rect>
    <rect
      [attr.x]="bar.x"
      [attr.y]="225 - bar.value * 1.9 * 0.76"
      width="11"
      [attr.height]="bar.value * 1.9 * 0.76"
      fill="#6976ff"
    />
    <text [attr.x]="bar.x + 5" y="249" text-anchor="middle" fill="#a5b4c8" font-size="11">
      {{ bar.label }}
    </text>
  }
</svg>
<div class="mt-2 flex items-center justify-between border-t border-border/60 pt-4">
  <span class="text-[11px] text-muted">Respecto al período anterior</span
  ><span class="text-xs font-medium text-success">+{{ week() === 'Esta semana' ? '12.8' : '8.4' }}% ↗</span>
</div>
