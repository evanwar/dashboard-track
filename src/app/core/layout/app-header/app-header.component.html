<header
  class="fixed inset-x-0 top-0 z-30 flex h-20 items-center border-b border-border/60 bg-sidebar px-4 md:px-6"
>
  <a
    routerLink="/dashboard"
    class="flex w-auto shrink-0 items-center gap-2.5 lg:w-[232px]"
    aria-label="Nexo, ir al dashboard"
    ><span class="flex size-9 items-center justify-center rounded-xl bg-primary text-white"
      ><app-icon name="layers" [size]="23" /></span
    ><span class="text-[26px] font-semibold tracking-[-1px]">nexo<span class="text-primary">.</span></span
    ><span class="ml-1 hidden pt-1 text-[9px] font-medium tracking-widest text-muted sm:block">ADMIN</span></a
  >
  <button
    class="icon-btn ml-3"
    (click)="toggleSidebar.emit()"
    [attr.aria-label]="collapsed() ? 'Expandir navegación' : 'Alternar navegación'"
    aria-controls="app-navigation"
  >
    <app-icon [name]="collapsed() ? 'expand' : 'collapse'" />
  </button>
  <div class="ml-5 hidden items-center gap-2 text-xs text-muted md:flex">
    <span>Espacio de trabajo</span><app-icon name="right" [size]="13" /><span class="text-ink">{{
      title()
    }}</span>
  </div>
  <div class="ml-auto flex items-center gap-2 sm:gap-4">
    <span class="hidden items-center gap-1.5 text-[11px] text-muted xl:flex"
      ><span class="size-1.5 rounded-full bg-success"></span>Entorno de demostración</span
    >
    <button
      class="icon-btn"
      aria-label="Información del tema oscuro"
      (click)="notify.emit('Tema oscuro activo, inspirado en la referencia visual')"
    >
      <app-icon name="moon" [size]="19" />
    </button>
    <div class="relative">
      <button
        class="icon-btn relative"
        aria-label="Notificaciones de demostración"
        [attr.aria-expanded]="panel() === 'notifications'"
        (click)="toggle('notifications')"
      >
        <app-icon name="bell" /><span
          class="absolute right-3 top-2.5 size-1.5 rounded-full bg-primary ring-2 ring-sidebar"
        ></span>
      </button>
      @if (panel() === 'notifications') {
        <section class="panel absolute right-0 top-14 w-[min(310px,80vw)] p-5 shadow-xl">
          <div class="mb-4 flex items-center justify-between">
            <h2 class="text-sm font-semibold">Notificaciones</h2>
            <button class="text-xs text-info" (click)="panel.set(null)">Cerrar</button>
          </div>
          <p class="mb-4 border-b border-border pb-4 text-xs leading-6 text-muted">
            6 solicitudes de ejemplo esperan revisión.<a
              routerLink="/cuentas/autorizacion"
              class="block text-info"
              (click)="panel.set(null)"
              >Revisar solicitudes →</a
            >
          </p>
          <p class="text-xs leading-6 text-muted">El entorno de demostración está listo para explorar.</p>
        </section>
      }
    </div>
    <div class="h-8 w-px bg-border"></div>
    <div class="relative">
      <button
        class="flex min-h-11 items-center gap-3 rounded-lg p-1.5 hover:bg-hover"
        [attr.aria-expanded]="panel() === 'user'"
        (click)="toggle('user')"
        aria-label="Abrir menú de usuario"
      >
        <span class="hidden text-right sm:block"
          ><span class="block text-xs font-semibold">Alex Demo</span
          ><span class="block text-[10px] text-muted">Administrador</span></span
        ><span
          class="flex size-9 items-center justify-center rounded-full border border-info/25 bg-info/15 text-xs font-semibold text-info"
          >AD</span
        ><app-icon name="down" [size]="15" />
      </button>
      @if (panel() === 'user') {
        <div class="panel absolute right-0 top-16 w-60 p-3 shadow-xl">
          <p class="border-b border-border px-2 pb-3 text-xs text-muted">Perfil de demostración</p>
          <button
            class="icon-menu"
            (click)="notify.emit('Perfil de ejemplo: Alex Demo · Administrador'); panel.set(null)"
          >
            <app-icon name="users" [size]="16" />Ver perfil</button
          ><button
            class="icon-menu"
            (click)="notify.emit('Esta maqueta no utiliza sesiones ni autenticación'); panel.set(null)"
          >
            <app-icon name="logout" [size]="16" />Información de sesión
          </button>
        </div>
      }
    </div>
  </div>
</header>
